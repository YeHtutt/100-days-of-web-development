<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>HTML Forms</title>
</head>

<body>
    <form action="/" method="GET">
        <label for="username">Your name</label>
        <!--id variable to connect the inputfield with the label-->
        <input type="text" name="user-name" id="username">
        

        <label for="useremail">Your email address</label>
        <input type="email" name="user-name" id="useremail">
    
        <label for="userage">Your age</label>
        <!--step shows the arrow up and down on the html page for number steps-->
        <input type="number" step="1" name="user-age" id="userage">
        
        <label for="userpassword">Your password</label>
        <input type="password" name="user-password" id="userpassword">
        
        <label for="birthdate">Your birthdate</label>
        <input type="date" id="birthdate" name="user-birthdate">

        <button>Submit</button>
    </form>
</body>

</html>
