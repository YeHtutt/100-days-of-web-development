<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>HTML Forms</title>
</head>

<body>
    <header>
        <h1>Demo Form</h1>
    </header>
    <main>
        <form action="/" method="GET">
            <section>
                <h2>Your personal details</h2>
                <ul>
                    <li>
                        <label for="username">Your name</label>
                        <!--id variable to connect the inputfield with the label-->
                        <input type="text" name="user-name" id="username" required placeholder="Jon Doe">
                    </li>
                    <li><label for="useremail">Your email address</label>
                        <input type="email" name="user-name" id="useremail" required>
                    </li>
                    <li> <label for="userpassword">Your password</label>
                        <input type="password" name="user-password" id="userpassword" required minlength="7">
                    </li>
                </ul>
            </section>


            <section>
                <h2>More details</h2>
                <ul>
                    <li>
                        <label for="userage">Your age</label>
                        <!--step shows the arrow up and down on the html page for number steps-->
                        <input type="number" step="1" name="user-age" id="userage" required min="18" max="100">
                    </li>
                    <li>
                        <label for="birthdate">Your birthdate</label>
                        <input type="date" id="birthdate" name="user-birthdate" required min="1921-01-01" max="2003-01-01" />
                    </li>
                    <li>
                        <label for="favourite-color">Your favourite color?</label>
                        <select name="favourite-color" id="favourite-color">
                            <option value="blue">My favourite color is Blue</option>
                            <option value="black">Black</option>
                            <option value="red">Red</option>
                        </select>
                    </li>
                </ul>
            </section>

            <section>
                <label for="usermessage">Your message</label>
                <textarea name="user-message" id="usermessage"  required rows="8"></textarea>
            </section>

            <section>
                <hr>
                <h2>How should we verify your account?</h2>
                <ul>
                    <li class="form-control-inline">
                        <input type="radio" name="verify" id="verify-text-message" value="text-message" required />
                        <label for="verify-text-message">Via text message (SMS)</label>
                    </li>
                    <li class="form-control-inline">
                        <input type="radio" name="verify" id="verify-phone" value="phone" required />
                        <label for="verify-phone">Via a phone call</label>
                    </li>
                    <li class="form-control-inline">
                        <input type="radio" name="verify" id="verify-email" value="email" required />
                        <label for="verify-email">Via an email</label>
                    </li>
                </ul>
            </section>

            <section>
                <h2>How should we contact you?</h2>
                <ul>
                    <li class="form-control-inline">
                        <input type="checkbox" id="contact-email" name="contact" value="email" />
                        <label for="contact-email">Contact me via email</label>
                    </li>
                    <li class="form-control-inline">
                        <input type="checkbox" id="contact-phone" name="contact" value="phone" />
                        <label for="contact-phone">Contact me via phone</label>
                    </li>
                </ul>
            </section>

            <hr>
            <section>
                <div class="form-control-inline">
                    <input type="checkbox" id="agree-terms" name="terms" />
                    <label for="agree-terms">Agree to terms?</label>
                </div>
            </section>

            <section>
                <button>Submit</button>
            </section>
        </form>
    </main>
</body>

</html>
